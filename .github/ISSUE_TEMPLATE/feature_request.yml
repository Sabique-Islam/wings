name: Feature request
description: Suggest a new capability or improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and proposed solution. Large features may need discussion before implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point or limitation are you hitting?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor / blocks
        - Journal / pages
        - Sharing / collaboration
        - AI assistant
        - Auth / account
        - Mobile / responsive
        - Performance
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this (guidance welcome)
        - label: I can help test a PR

  - type: textarea
    id: mockups
    attributes:
      label: Mockups, examples, or references
      description: Links to Notion, other apps, sketches, etc.
